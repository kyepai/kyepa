  <!-- Both deferred: deferred scripts run in document order, so the config
       is always in place before the renderer boots.

       The homepage's script.js is deliberately NOT loaded here: it hands the
       background over to a second video at 67% scroll, and this page only
       carries the one (the lighter of the two — most visitors arrive from
       Instagram on mobile). styling.js sets --progress itself instead.
       The GREENLIT campaign pop-up is also left off — see styling/README.md. -->
