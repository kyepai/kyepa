<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover opts this page into the iPhone safe-area insets the
       CSS reads. Deliberately NOT added to the homepage, where it would
       change the existing layout under the notch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- The experience is intentionally dark; this stops OS light mode from
       recolouring form controls or scrollbars against it. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07080a">

  <title>Sint Maarten @ Mr Gay World 2026 — Kyepa</title>
  <meta name="description" content="Kyle “Kyepa” Patrick represents Sint Maarten at Mr Gay World 2026 in Cebu, 22 November – 1 December. Greenlit at the last minute. Follow the journey.">
  <link rel="canonical" href="https://kyepa.com/mgw/">

  <!-- Open Graph / Twitter: what WhatsApp, Instagram and iMessage read when
       the link is shared. Absolute URLs are required here.
       TODO(Kyle): /assets/mgw/og.jpg is currently a generated placeholder. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kyepa">
  <meta property="og:url" content="https://kyepa.com/mgw/">
  <meta property="og:title" content="Sint Maarten is going to Cebu.">
  <meta property="og:description" content="Kyle “Kyepa” Patrick represents Sint Maarten at Mr Gay World 2026. Greenlit at the last minute. Now it’s your turn.">
  <meta property="og:image" content="https://kyepa.com/assets/mgw/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sint Maarten at Mr Gay World 2026, Cebu, Philippines">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sint Maarten is going to Cebu.">
  <meta name="twitter:description" content="Mr Gay World 2026, Cebu, 22 Nov – 1 Dec. Greenlit at the last minute.">
  <meta name="twitter:image" content="https://kyepa.com/assets/mgw/og.jpg">

  <link rel="icon" href="../logo.svg" type="image/svg+xml">

  <!-- Fonts: condensed display (Oswald), grotesk body (Inter), mono for the
       film metadata (IBM Plex Mono). One request, exact weights only. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="mgw.css">
  <!-- The hero image is the only large asset; warm it up early. -->
  <link rel="preload" as="image" href="../assets/mgw/hero.jpg" fetchpriority="low">
</head>
<body style="margin:0;background:#07080a">

  <!-- mgw.js renders the whole experience in here. Copy lives in
       mgw.config.js, so there is no markup to keep in sync by hand. -->
  <div id="mgw-page">
    <noscript>
      <!-- Everything essential, with no JavaScript: real text, real links. -->
      <div style="max-width:40rem;margin:0 auto;padding:18vh 1.5rem;font-family:system-ui,sans-serif;color:#f4f4f1">
        <p style="font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;color:#8a8f98;margin-bottom:1rem">
          Mr Gay World 2026 · Cebu, Philippines · 22 Nov – 1 Dec
        </p>
        <h1 style="font-size:2.5rem;line-height:1.05;margin-bottom:1rem">
          Sint Maarten is going to Cebu.
        </h1>
        <p style="font-size:1.0625rem;line-height:1.6;color:#d8dade;margin-bottom:2rem">
          Greenlit at the last minute. Now it’s your turn.
        </p>
        <p style="line-height:2.4">
          <a style="color:#07080a;background:#e4e6ea;padding:.9rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:600"
             href="mailto:info@kyepa.com?subject=Notify%20me%20when%20voting%20opens">Get notified when voting opens</a>
        </p>
        <p style="margin-top:2rem;line-height:2">
          <a style="color:#d8dade" href="https://instagram.com/kye_pa" target="_blank" rel="noopener">Follow the journey @kye_pa</a><br>
          <a style="color:#d8dade" href="mailto:info@kyepa.com">info@kyepa.com</a><br>
          <a style="color:#d8dade" href="../index.html">kyepa.com</a>
        </p>
      </div>
    </noscript>
  </div>

  <!-- Both deferred: deferred scripts still run in document order, so the
       config is always in place before the engine boots. -->
  <script src="mgw.config.js" defer></script>
  <script src="mgw.js" defer></script>
</body>
</html>
